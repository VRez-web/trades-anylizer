name: keep-alive

# Render free засыпает после 15 мин без запросов, Supabase free — после 7 дней без активности БД.
# /api/health будит Render и делает SELECT в Supabase. URL: Settings → Secrets and variables → Actions → Variables → HEALTH_URL
# (например https://<app>.onrender.com/api/health).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL variable is not set"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$HEALTH_URL"
